services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: str
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs the same migrations as Supabase, in filename order, on first start
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d str"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    environment:
      # Set DATABASE_URL in .env to use hosted Supabase; otherwise the local db is used
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/str}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      DATA_DIR: /data
      # Integration tests create throwaway databases on the local db, never on Supabase
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/postgres
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./data:/data:ro
      - ./supabase/migrations:/migrations:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ./frontend
    environment:
      # The browser never calls the API; Next.js server code does, over the compose network
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
